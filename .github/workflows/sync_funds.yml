name: FonSohbet Cift Dikis Fon Senkronizasyonu

on:
  schedule:
    # 1. DİKİŞ: Akşam 19:45 TSİ (16:45 UTC) -> İlk açıklanan yerli fonları erkenden yakala!
    - cron: '45 16 * * *'
    
    # 2. DİKİŞ: Sabah 09:45 TSİ (06:45 UTC) -> Takasbank resmi bülteniyle %100 kesinleştir!
    - cron: '45 6 * * *'
    
  workflow_dispatch: # GitHub UI üzerinden manuel tetikleme

jobs:
  scrape_and_sync:
    name: Çift Dikiş Fon Senkronizasyonu
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TEFAS Senkronizasyonunu Çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python -m app.jobs.sync_funds --days 35

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        run: |
          git config --global user.name "FonSohbet Bot"
          git config --global user.email "bot@fonsohbet.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Fon Verileri Güncellendi (Çift Dikiş)" && git push)
